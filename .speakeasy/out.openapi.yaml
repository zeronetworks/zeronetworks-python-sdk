    authenticationPackageSummary:
      type: object
      properties:
        count:
          type: integer
        name:
          type: string
    awsCloudDeploymentAddBody:
      type: object
      required:
        - type
        - awsAccountId
        - name
        - roleName
        - managementScope
      properties:
        type:
          type: string
          enum: [ORGANIZATION, ACCOUNT]
          description: Onboard an organization through its management account, or a single account as an account cloud deployment
        awsAccountId:
          type: string
          pattern: ^[0-9]{12}$
          description: AWS Account ID of the management account or of the account cloud deployment
        name:
          type: string
          description: Cloud deployment name
        roleName:
          type: string
          description: Name of the AWS IAM role to assume in every synced account
        autoSyncNewAccounts:
          type: boolean
          description: Auto sync new accounts of the organization. Required for an organization and forbidden for an account
        managementScope:
          type: string
          enum: [ALL_RESOURCES, ALL_RESOURCES_EXCLUDE_VMS]
          description: Management scope for AWS resources
    awsCloudDeploymentUpdateBody:
      type: object
      required:
        - name
        - roleName
        - autoSyncNewAccounts
        - managementScope
      properties:
        name:
          type: string
          description: Cloud deployment name
        roleName:
          type: string
          description: Name of the AWS IAM role to assume in every synced account
        autoSyncNewAccounts:
          type: boolean
          description: Auto sync new accounts of the organization. Must be false for an account cloud deployment
        managementScope:
          type: string
          enum: [ALL_RESOURCES, ALL_RESOURCES_EXCLUDE_VMS]
          description: Management scope for AWS resources
    awsCloudDeploymentInfo:
      type: object
      properties:
        id:
          type: string
          description: AWS cloud deployment entity ID
        type:
          type: string
          enum: [ORGANIZATION, ACCOUNT]
          description: Whether the cloud deployment onboards an organization or a single account
        awsAccountId:
          type: string
          description: AWS Account ID of the management account or of the account cloud deployment
        name:
          type: string
          description: Cloud deployment name
        roleName:
          type: string
          description: Name of the AWS IAM role assumed in every synced account
        autoSyncNewAccounts:
          type: boolean
          description: Auto sync new accounts of the organization. Always false for an account cloud deployment
        managementScope:
          type: string
          enum: [ALL_RESOURCES, ALL_RESOURCES_EXCLUDE_VMS]
          description: Management scope for AWS resources
        syncStatus:
          $ref: '#/components/schemas/cloudSyncStatus'
        organizationId:
          type: string
          description: AWS organization entity ID, for an organization cloud deployment
        awsOrganizationId:
          type: string
          description: AWS Organization ID, for an organization cloud deployment
        accountId:
          type: string
          description: AWS account entity ID, for an account cloud deployment
    awsCloudDeploymentsList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/awsCloudDeploymentInfo'
    awsCloudDeploymentResponse:
      type: object
      properties:
        deploymentInfo:
          $ref: '#/components/schemas/awsCloudDeploymentInfo'
    awsAccountInfo:
      type: object
      properties:
        id:
          type: string
          description: AWS account entity ID
        name:
          type: string
          description: AWS account name
        awsId:
          type: string
          description: AWS Account ID
        roleArn:
          type: string
          description: AWS IAM Role ARN to assume
        cloudDeploymentId:
          type: string
          description: AWS cloud deployment entity ID
        shouldSync:
          type: boolean
          description: Whether the account should be synced
        state:
          type: integer
          enum: [0, 1, 2, 3, 4, 5]
          description: |
            Account state:
            * 0 - Unspecified
            * 1 - Enabled
            * 2 - Warned
            * 3 - Past due
            * 4 - Disabled
            * 5 - Deleted
        organizationalUnitAncestors:
          type: array
          description: Full organizational unit ancestor chain, ordered root to immediate parent
          items:
            $ref: '#/components/schemas/idNamePair'
        syncStatus:
          $ref: '#/components/schemas/cloudSyncStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        organizationName:
          type: string
          description: Name of the AWS organization the account belongs to. Returned only by the get-account endpoint, and absent for a standalone account
        awsOrganizationId:
          type: string
          description: AWS organization ID of the account's organization. Returned only by the get-account endpoint, and absent for a standalone account
    awsAccountsList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/awsAccountInfo'
        count:
          type: integer
          description: Total count of items
    awsAccountResponse:
      type: object
      properties:
        accountInfo:
          $ref: '#/components/schemas/awsAccountInfo'
    awsAccountsSyncConfigBody:
      type: object
      required:
        - accountIds
        - shouldSync
      properties:
        accountIds:
          type: array
          minItems: 1
          items:
            type: string
          description: AWS account entity IDs to update
        shouldSync:
          type: boolean
          description: Whether the accounts should be synced
    azureTenantCredentialsBody:
      type: object
      required:
        - azureTenantId
        - tenantName
        - clientId
        - clientSecret
        - autoSyncNewSubscriptions
        - managementScope
