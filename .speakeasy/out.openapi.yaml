          type: string
          description: Azure Tenant entity ID
        azureId:
          type: string
          description: Azure Tenant ID
        name:
          type: string
          description: Azure Tenant Name
        clientId:
          type: string
          description: Azure Client ID
        syncStatus:
          $ref: '#/components/schemas/cloudSyncStatus'
        autoSyncNewSubscriptions:
          type: boolean
