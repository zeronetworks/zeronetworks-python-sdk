components:
  parameters:
    activityTypeParameter:
      name: activityType
      in: path
      description: the activity type
      required: true
      schema:
        type: string
        enum:
          - network
    addAncestorsParameter:
      name: _add_ancestors
      in: query
      description: show rules where the asset is part of a group
      schema:
        type: boolean
        default: true
    addBuiltinsParameter:
      name: _add_builtins
      in: query
      description: show global rules
      schema:
        type: boolean
        default: false
    exclusionIdParameter:
      name: exclusionId
      in: path
      description: The id of the network alert exclusion
      required: true
      schema:
        type: string
    networkAlertExclusionsOrderColumnParameter:
      name: orderColumns[]
      in: query
      description: what column to order network alert exclusions on
      schema:
        type: array
        items:
          type: string
          enum:
            - createdAt
            - updatedAt
        example:
          - createdAt
    alertIdParameter:
      name: alertId
      in: path
      description: The id of the network alert
      required: true
      schema:
        type: string
        format: uuid
    includeClosedParameter:
      name: include_closed
      in: query
      description: Include closed alerts in the results
      schema:
        type: boolean
        default: false
    networkAlertsOrderColumnParameter:
      name: orderColumns[]
      in: query
      description: what column to order network alerts on
      schema:
        type: array
        items:
          type: string
          enum:
            - lastSeen
            - firstSeen
            - occurrences
            - severity
            - threatLevel
            - createdAt
            - assignee
            - classification
            - mainEntityId
        example:
          - lastSeen
    alertStatsTimeFrameParameter:
      name: timeFrame
      in: query
      description: |
        timeframe parameter One Month = 1 Three Monthes = 3 Six Monthes = 6 One Year = 12
      schema:
        type: integer
        format: int32
        default: 1
        enum:
          - 1
          - 3
          - 6
          - 12
    analysisDirectionParameter:
      name: direction
      in: query
      description: direction for the query, incoming or outgoing
      required: true
      schema:
        type: string
      example: incoming
    assetIdParameter:
      name: assetId
      in: path
      description: assetId to filter on
      required: true
      schema:
        type: string
        pattern: ^a:[a-z]:[a-zA-Z0-9]{8}$
      example: a:a:JF2xro6g
    assetIdQueryParameter:
      name: assetId
      in: query
      description: assetId to filter on
      required: true
      schema:
        type: string
        pattern: ^a:[a-z]:[a-zA-Z0-9]{8}$
      example: a:a:JF2xro6g
    clientIdParameter:
      name: clientId
      in: path
      description: clientId to filter on
      required: true
      schema:
        type: string
    connectionStateParameter:
      name: connection_state
      in: query
      description: connection state for the query
      required: true
      schema:
        type: integer
        default: 3
        enum:
          - 1
          - 2
          - 3
          - 4
          - 5
    connectClientDownloadParameter:
      name: platform
      in: query
      description: connect client platform
      required: true
      schema:
        type: integer
        enum:
          - 1
          - 2
          - 3
          - 4
    cloudConnectorInstallerPackageFormatParameter:
      name: packageFormat
      in: query
      description: cloud connector installer package format. Omit for the default Windows installer zip. 4 is the Windows MSI installer.
      required: false
      schema:
        type: integer
        enum:
          - 1
          - 4
    connectClientPackageFormatParameter:
      name: packageFormat
      in: query
      description: connect client package format. Omit for the platform default installer. Linux (platform 4) requires 3 (deb). 4 is the MSI installer (Windows only).
      required: false
      schema:
        type: integer
        enum:
          - 1
          - 2
          - 3
          - 4
    connectRegionIdParameter:
      name: regionId
      in: path
      description: connect region id
      required: true
      schema:
        type: string
      example: r:a:q0tqD2rf
    connectServerIdParameter:
      name: connectServerId
      in: path
      description: connect server id
      required: true
      schema:
        type: string
      example: y:a:jUDZuhXU
    postureProfileIdParameter:
      name: profileId
      in: path
      description: posture profile id
      required: true
      schema:
        type: string
        format: uuid
      example: ab803afb-83bd-4bfe-9e0e-a5db212d134b
    cursorParameter:
      name: _cursor
      in: query
      description: cursor position to start at
      schema:
        type: integer
        format: int64
        pattern: ^\d{13}$
      example: 1647305854366
    customUserIdParameter:
      name: customUserId
      in: path
      description: id of the customer user
      required: true
      schema:
        type: string
        format: uuid
      example: ab803afb-83bd-4bfe-9e0e-a5db211d134b
    freezePeriodIdPathParameter:
      name: freezePeriodId
      in: path
      description: id of freeze period
      required: true
      schema:
        type: string
        format: uuid
    platformParameter:
      name: platform
      in: path
      description: platform
      required: true
      schema:
        type: string
        enum:
          - WIN_X64
          - WIN_X86
          - LINUX_X64
          - LINUX_X86
          - MAC_X64
          - MAC_ARM64
    productPathParam:
      name: product
      in: path
      required: true
      description: Product type for which to modify or fetch the version maintenance window
      schema:
        type: string
        enum:
          - segment-server
          - cloud-connector
          - connect-server
          - connect-client
    pilotGroupProductPathParam:
      name: product
      in: path
      required: true
      description: Product type for pilot group
      schema:
        type: string
        enum:
          - cloud-connector
    pilotRolloutProductPathParam:
      name: product
      in: path
      required: true
      description: Product type for pilot rollout
      schema:
        type: string
        enum:
          - cloud-connector
          - segment-server
    clusterPilotGroupProductPathParam:
      name: product
      in: path
      required: true
      description: Product type for cluster pilot group
      schema:
        type: string
        enum:
          - segment-server
    pilotGroupOsTypePathParam:
      name: osType
      in: path
      required: true
      description: OS type for pilot group
      schema:
        type: string
        enum:
          - windows
          - linux
          - mac
    directionParameter:
      name: direction
      in: query
      description: direction for the query, 1=Inbound, 2=Outbound, 3=Both
      required: true
      schema:
        type: integer
      example: 1
    directlyRetrievedFromAssetParameter:
      name: directly_retrieved_from_asset
      in: query
      description: Only get activities retrieved from the asset
      required: true
      schema:
        type: boolean
      example: true
    domainParameter:
      name: domain
      in: query
      description: The domain to filter on
      required: true
      schema:
        type: string
        example: child.zeronetworks.com
    domainIdParameter:
      name: domainId
      in: path
      description: The fqdn of the domain
      required: true
      schema:
        type: string
        example: child.zeronetworks.com
    dstAssetId:
      name: dstAssetId
      in: query
      description: Id of dest asset
      required: true
      schema:
        type: string
    dstProcess:
      name: dstProcess
      in: query
      description: Dest process
      schema:
        type: string
    enrichRemoteIPsParameter:
      name: _enrich_remote_ips
      in: query
      description: enrich remote IPs
      schema:
        type: boolean
        default: true
    entityCursorParameter:
      name: _cursor
      in: query
      description: Used to page through results
      schema:
        type: string
    entityIdParameter:
      name: entityId
      in: path
      description: The id of the user or group
      required: true
      schema:
        type: string
    entityIdQueryParameter:
      name: _entityId
      in: query
      description: entityId to filter on
      schema:
        type: string
    entityParams:
      name: entityParams
      in: query
      required: false
      schema:
        type: string
      description: 'JSON string URI encoded object {id: string, direction: AssetDirection}'
    exportIdParameter:
      name: exportId
      in: path
      description: exportId to download
      required: true
      schema:
        type: string
    externalAccessPolicyIdParameter:
      name: policyId
      in: path
      description: id of the external acess policy
      required: true
      schema:
        type: string
        example: p:e:8199d54b
    externalIdParameter:
      name: externalId
      in: path
      description: The external id of the group
      required: true
      schema:
        type: string
    eventTypeParameter:
      name: eventType
      in: query
      description: 0-Success, 2-Failure
      required: true
      schema:
        type: integer
        enum:
          - 1
          - 2
    filterIdParameter:
      name: filterId
      in: path
      description: The saved filter id
      required: true
      schema:
        type: string
        example: e:f:VGL7nXce
    filtersParameter:
      name: _filters
      in: query
      description: JSON string URI encoded set of filters
      schema:
        type: string
    forestIdParameter:
      name: forestId
      in: path
      description: The forest id
      required: true
      schema:
        type: string
        example: f:a:8199d54b
    forestIdQueryParameter:
      name: _forestId
      in: query
      description: The forest id
      required: true
      schema:
        type: string
        example: f:a:8199d54b
    fqdnParameter:
      name: fqdn
      in: query
      description: fully qualified domain name
      schema:
        type: string
      example: server.domain.local
    fromParameter:
      name: from
      in: query
      description: startTime in epoch(ms)
      schema:
        type: integer
        format: int64
        pattern: ^\d{13}$
      example: 1647308838000
    fromRequiredParameter:
      name: from
      in: query
      description: startTime in epoch(ms)
      required: true
      schema:
        type: integer
        format: int64
        pattern: ^\d{13}$
      example: 1647308838000
    groupIdParameter:
      name: groupId
      in: path
      description: groupId to filter on
      required: true
      schema:
        type: string
        pattern: ^g:[acsot]:[a-zA-Z0-9]{8}$
      example: g:t:01445453
      x-speakeasy-name-override: id
    groupIdQueryParameter:
      name: _groupId
      in: query
      description: groupId to filter on
      schema:
        type: string
        pattern: ^g:[acs]:[a-zA-Z0-9]{8}$
    groupOrAssetIdParameter:
      name: groupOrAssetId
      description: group or asset id to filter on
      in: path
      required: true
      schema:
        type: string
        pattern: ^[ag]:[acdjlngt]:[a-zA-Z0-9]{8}$
    groupOrUserIdParameter:
      name: groupOrUserId
      description: group or user id to filter on
      in: path
      required: true
      schema:
        type: string
        pattern: ^[gu]:[ac]:[a-zA-Z0-9]{8}$
    groupTypeParameter:
      name: groupType
      in: path
      description: group type to filter on
      required: true
      schema:
        type: string
        pattern: ^ad$|^custom$|^ot$|^system$|^tag$|^inactive$
        default: tag
    hypervisorIdParameter:
      name: hypervisorId
      in: path
      required: true
      schema:
        type: string
    identityProviderIdParameter:
      name: identityProviderId
      in: path
      description: Identity provider Id
      required: true
      schema:
        type: string
        enum:
          - azure
          - custom
          - cyberark
          - duo
          - ping-identity
          - okta
    includeGlobalRulesParameter:
      name: includeGlobalRules
      in: query
      description: include global rules in the result
      schema:
        type: boolean
        default: false
    includeNestedMembersQueryParameter:
      name: includeNestedMembers
      in: query
      description: include nested members in the result
      required: true
      schema:
        type: boolean
    ipAliasIdParameter:
      name: ipAliasId
      in: path
      description: IP Alias ID
      required: true
      schema:
        type: string
        example: e:i:9xuR9t8M
    ipParameter:
      name: ip
      in: query
      description: IP address
      required: true
      schema:
        type: string
        pattern: '[0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}'
    ipRangeParameter:
      name: ipRange
      in: query
      description: IP Address Range
      required: true
      schema:
        type: string
        example: 1.1.1.1-1.1.1.2
        pattern: '[0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}-[0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}'
    ipSubnetParameter:
      name: subnet
      in: query
      description: IP Subnet
      required: true
      schema:
