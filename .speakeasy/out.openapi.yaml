    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    '409':
      description: Already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    '500':
      description: Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    200_empty:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/emptyResponse'
    409_stale:
      description: Conflict - the object was modified or deleted since the zn-expected-updated-at value
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/staleConflictError'
