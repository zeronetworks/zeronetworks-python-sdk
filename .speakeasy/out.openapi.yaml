        azureTenantId:
          type: string
          description: Azure Tenant ID
        tenantName:
          type: string
          description: Azure Tenant Name
        clientId:
          type: string
          description: Azure Client ID
        clientSecret:
          type: string
          description: Azure Client Secret
        autoSyncNewSubscriptions:
          type: boolean
          description: Auto sync new subscriptions
        managementScope:
          type: string
          enum: [ALL_RESOURCES, ALL_RESOURCES_EXCLUDE_VMS]
          description: Management scope for Azure resources
